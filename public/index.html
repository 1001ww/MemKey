<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemKey · 本地密码保险库</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%232F5FE8"/><rect x="20" y="28" width="24" height="20" rx="5" fill="none" stroke="white" stroke-width="4"/><path d="M25 28v-6a7 7 0 0 1 14 0v6" fill="none" stroke="white" stroke-width="4"/></svg>'>
<style>
/* ============ 设计令牌（浅色 · 蓝白经典） ============ */
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --soft:#EDF1F8; --soft2:#E5EBF4;
  --line:#E2E8F2; --line-strong:#C9D4E3;
  --text:#1B2540; --muted:#5D6B85; --faint:#98A5BB;
  --blue:#2F5FE8; --blue-hi:#1F49C4; --blue-soft:#E9F0FD; --blue-line:#B8CCF5;
  --red:#DC2626; --red-soft:#FCEBEB; --red-line:#F2C4C4;
  --green:#1A9E4B; --green-soft:#E6F6EC; --green-line:#B8E4C8;
  --amber:#C77414; --amber-soft:#FCF2E3; --amber-line:#F0D9B4;
  --font:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --mono:"Cascadia Code",ui-monospace,"SF Mono",Consolas,"Courier New",monospace;
  --rad:12px;
  --shadow-card:0 1px 2px rgba(27,37,64,.04), 0 8px 24px -14px rgba(27,37,64,.14);
  --shadow-pop:0 4px 12px rgba(27,37,64,.08), 0 24px 56px -16px rgba(27,37,64,.24);
}
*{ margin:0; padding:0; box-sizing:border-box }
[hidden]{ display:none !important }
html,body{ height:100% }
body{ font-family:var(--font); background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden }
::selection{ background:rgba(47,95,232,.18) }
::-webkit-scrollbar{ width:10px; height:10px }
::-webkit-scrollbar-thumb{ background:#C9D4E3; border-radius:6px; border:3px solid var(--bg) }
::-webkit-scrollbar-thumb:hover{ background:#B0BFd4 }
::-webkit-scrollbar-track{ background:transparent }
button{ font-family:inherit }
a{ color:var(--blue); text-decoration:none }
a:hover{ text-decoration:underline }
.mono{ font-family:var(--mono) }
.grow{ flex:1 }

/* ============ 通用组件 ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:38px; padding:0 16px; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--card); color:var(--text); font-size:14px; font-weight:500;
  cursor:pointer; transition:background .15s,border-color .15s,box-shadow .15s,transform .06s;
  white-space:nowrap;
}
.btn:hover{ background:#F7F9FC; border-color:#B4C2D8; box-shadow:0 1px 3px rgba(27,37,64,.08) }
.btn:active{ transform:translateY(1px) }
.btn-primary{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600 }
.btn-primary:hover{ background:var(--blue-hi); border-color:var(--blue-hi); box-shadow:0 4px 14px -4px rgba(47,95,232,.5) }
.btn-danger{ background:var(--card); border-color:var(--red-line); color:var(--red) }
.btn-danger:hover{ background:var(--red-soft); border-color:var(--red) }
.btn-warn{ background:var(--card); border-color:var(--amber-line); color:var(--amber) }
.btn-warn:hover{ background:var(--amber-soft); border-color:var(--amber) }
.btn-block{ width:100% }
.btn-sm{ height:30px; padding:0 12px; font-size:13px; border-radius:8px }
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:32px; height:32px; border-radius:8px; border:1px solid transparent;
  background:transparent; color:var(--muted); cursor:pointer;
  transition:color .15s,background .15s,border-color .15s;
}
.icon-btn:hover{ color:var(--text); background:var(--soft); border-color:var(--line-strong) }
.icon-btn svg{ display:block }
:is(button,a,[tabindex]):focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:8px }

input[type=text],input[type=password],input[type=url],input:not([type]),select,textarea{
  width:100%; height:40px; background:var(--card); border:1px solid var(--line-strong);
  color:var(--text); border-radius:10px; padding:0 12px; font:inherit;
  transition:border-color .15s,box-shadow .15s;
}
textarea{ height:auto; padding:10px 12px; resize:vertical; min-height:60px }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,95,232,.13) }
input::placeholder,textarea::placeholder{ color:var(--faint) }
select{ cursor:pointer; width:auto; min-width:110px }
select option{ background:var(--card); color:var(--text) }

/* 自定义下拉 */
.dd{ position:relative }
.dd-btn{
  display:flex; align-items:center; width:100%; height:40px; padding:0 12px;
  background:var(--card); border:1px solid var(--line-strong); border-radius:10px;
  color:var(--text); font:inherit; font-size:14px; cursor:pointer; text-align:left;
  transition:border-color .15s,box-shadow .15s;
}
.dd-btn:hover{ border-color:#B4C2D8 }
.dd.open .dd-btn{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,95,232,.13) }
.dd-cur{ display:flex; align-items:center; gap:8px; flex:1; min-width:0 }
.dd-cur .dd-lb{ display:flex; align-items:center; gap:8px; min-width:0 }
.dd-arrow{ color:var(--faint); flex:none; transition:transform .15s }
.dd.open .dd-arrow{ transform:rotate(180deg) }
.dd-menu{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:60;
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow-pop); padding:4px; max-height:240px; overflow-y:auto;
  display:none; animation:fadeUp .14s ease-out;
}
.dd.open .dd-menu{ display:block }
.dd-opt{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13.5px }
.dd-opt:hover{ background:var(--soft); color:var(--text) }
.dd-opt.sel{ background:var(--blue-soft); color:var(--blue) }
.dd-opt .dd-lb{ display:flex; align-items:center; gap:8px; min-width:0; flex:1 }
.dd-opt .dd-check{ display:none; flex:none }
.dd-opt.sel .dd-check{ display:inline-flex }

label.flabel{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500 }
label.flabel i{ color:var(--red); font-style:normal }

/* 开关 */
.switch{ position:relative; display:inline-block; width:40px; height:22px; flex:none }
.switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1 }
.switch .knob{ position:absolute; inset:0; background:var(--soft2); border:1px solid var(--line-strong); border-radius:20px; transition:.16s }
.switch .knob::after{ content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; border:1px solid var(--line-strong); top:2px; left:2px; transition:.16s; box-shadow:0 1px 2px rgba(27,37,64,.15) }
.switch input:checked + .knob{ background:var(--blue); border-color:var(--blue) }
.switch input:checked + .knob::after{ left:19px; background:#fff; border-color:var(--blue) }

/* 复选 */
.check{ display:flex; gap:9px; align-items:center; cursor:pointer; font-size:13px; color:var(--muted) }
.check input{ accent-color:var(--blue); width:15px; height:15px; flex:none; cursor:pointer }

/* 强度条 */
.meter{ display:flex; gap:8px; align-items:center; margin-top:8px }
.meter .segs{ display:flex; gap:4px; flex:1 }
.meter .seg{ height:4px; flex:1; border-radius:2px; background:var(--soft2); transition:background .2s }
.meter .mlabel{ font-size:12px; color:var(--muted); min-width:56px; text-align:right; flex:none }

/* 滑杆 */
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px;
  background:var(--soft2); cursor:pointer; border:none; padding:0; box-shadow:none;
}
input[type=range]:focus{ outline:none }
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:var(--blue); border:2px solid #fff; box-shadow:0 1px 4px rgba(27,37,64,.3); cursor:pointer;
}
input[type=range]::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:var(--blue); border:2px solid #fff; box-shadow:0 1px 4px rgba(27,37,64,.3); cursor:pointer }

/* 微章 / 芯片 */
.badge{ min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--red); color:#fff; font-size:11px; font-weight:600; display:inline-grid; place-items:center; margin-left:auto; flex:none }
.chip{ font-size:12px; padding:3px 10px; border-radius:100px; background:var(--soft); color:var(--muted); border:1px solid var(--line); white-space:nowrap }
kbd{ font:11px var(--mono); color:var(--faint); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; background:var(--card); flex:none; transition:opacity .15s }

.spinner{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block }
@keyframes spin{ to{ transform:rotate(360deg) } }

@keyframes fadeUp{ from{ opacity:0; transform:translateY(7px) } to{ opacity:1; transform:none } }
.row-in{ animation:fadeUp .3s ease-out backwards }

/* ============ 认证屏 ============ */
.auth{
  position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(1100px 700px at 50% -10%, #E4EDFC 0%, var(--bg) 55%);
}
.auth-card{ width:min(400px,100%); display:flex; flex-direction:column; align-items:center; animation:fadeUp .4s ease-out backwards }
.emblem{ width:92px; height:92px; filter:drop-shadow(0 8px 24px rgba(47,95,232,.25)); margin-bottom:22px }
.emblem .ring-dash{ transform-origin:50% 50%; animation:spin 52s linear infinite }
.wordmark{ font-size:32px; font-weight:700; letter-spacing:.01em; line-height:1.2; color:var(--text) }
.wordmark b{ color:var(--blue); font-weight:700 }
.tagline{ font-size:13px; color:var(--muted); margin:6px 0 30px; letter-spacing:.05em }
.auth-form{ width:100%; display:flex; flex-direction:column; gap:4px }
.err{ color:var(--red); font-size:13px; margin:8px 2px; display:flex; gap:6px; align-items:center }
.auth .btn-block{ margin-top:12px; height:42px }
.auth-foot{ position:absolute; bottom:22px; font-size:11.5px; color:var(--faint); letter-spacing:.06em }
.shake{ animation:shake .4s }
@keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
.checklist{ list-style:none; margin:10px 0 4px; display:grid; gap:5px }
.checklist li{ display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--faint); transition:color .2s }
.checklist li svg{ flex:none }
.checklist li.ok{ color:var(--green) }
.warnbox{
  display:flex; gap:10px; align-items:flex-start; margin:14px 0 4px; padding:11px 13px;
  background:var(--amber-soft); border:1px solid var(--amber-line);
  border-radius:10px; font-size:12.5px; color:var(--amber); line-height:1.55;
}
.warnbox svg{ flex:none; margin-top:1px }
.ack{ margin:14px 0 2px }
.lock-note{ font-size:12.5px; color:var(--muted); margin-top:14px; text-align:center }
.forgot-link{ background:none; border:none; color:var(--faint); font-size:12.5px; cursor:pointer; margin-top:18px; text-decoration:underline; text-underline-offset:3px; font-family:inherit; transition:color .15s }
.forgot-link:hover{ color:var(--red) }

/* ============ 应用布局 ============ */
#scr-app{ position:fixed; inset:0; z-index:10; display:flex }
#sb-backdrop{ display:none }

#sidebar{
  width:250px; flex:none; background:var(--card); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:14px 12px 12px; gap:2px; z-index:41;
  overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:8px 10px 18px }
.brand .bmark{ width:30px; height:30px; flex:none }
.brand .bname{ font-size:16.5px; font-weight:700 }
.brand .bname b{ color:var(--blue); font-weight:700 }
.brand .bver{ font-size:10.5px; color:var(--faint); margin-left:auto; font-family:var(--mono) }

.nav-item{
  display:flex; align-items:center; gap:10px; height:37px; padding:0 10px;
  border-radius:9px; color:var(--muted); cursor:pointer; font-size:13.5px;
  border:1px solid transparent; user-select:none; transition:color .13s,background .13s;
}
.nav-item:hover{ color:var(--text); background:var(--soft) }
.nav-item.active{ color:var(--blue); background:var(--blue-soft); border-color:var(--blue-line) }
.nav-item .cnt{ margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums }
.nav-item.active .cnt{ color:var(--blue) }
.nav-item > span:not(.cnt):not(.badge){ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.nav-sec{ margin:15px 10px 6px; font-size:10.5px; letter-spacing:.16em; color:var(--faint); font-weight:600 }
.sb-bottom{ margin-top:auto; border-top:1px solid var(--line); padding-top:10px; display:grid; gap:2px }
.nav-lock:hover{ color:var(--red); background:var(--red-soft) }

#main{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg) }
#topbar{
  display:flex; align-items:center; gap:14px; padding:15px 26px;
  border-bottom:1px solid var(--line); background:rgba(243,245,250,.9); backdrop-filter:blur(8px);
  position:relative; z-index:5; flex-wrap:wrap;
}
#btn-menu{ display:none }
#page-title{ font-size:16.5px; font-weight:600; white-space:nowrap }
.search-box{
  display:flex; align-items:center; gap:8px; width:min(340px,100%); height:38px;
  padding:0 6px 0 12px; background:var(--card); border:1px solid var(--line-strong); border-radius:10px;
  color:var(--faint); transition:border-color .15s,box-shadow .15s; margin-left:auto;
}
.search-box:focus-within{ border-color:var(--blue) }
.search-box:focus-within kbd{ opacity:0 }
.search-box input{ flex:1; min-width:0; background:none; border:0; height:auto; padding:0; color:var(--text); box-shadow:none !important; outline:none !important; border-radius:0 }

#view{ flex:1; overflow-y:auto; padding:22px 26px 70px }
.view-inner{ max-width:920px; margin:0 auto }

/* 账号列表 */
.entry{
  display:flex; align-items:center; gap:13px; padding:10px 14px; margin-bottom:8px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--rad);
  cursor:default; box-shadow:var(--shadow-card);
  transition:box-shadow .14s,border-color .14s;
}
.entry:hover{ border-color:var(--line-strong); box-shadow:0 2px 4px rgba(27,37,64,.05), 0 14px 32px -16px rgba(27,37,64,.2) }
.avatar{
  width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
  font-weight:600; font-size:15.5px; flex:none;
}
.av-lg{ width:46px; height:46px; border-radius:12px; font-size:19px }
.row-main{ flex:1; min-width:0 }
.row-title{ font-weight:500; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row-sub{ font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px }
.row-actions{ display:flex; gap:3px; align-items:center }
.row-actions > *{ opacity:0; transition:opacity .15s }
.entry:hover .row-actions > *, .entry:focus-within .row-actions > *{ opacity:1 }
.row-actions > .star-btn.on{ opacity:1 }
.star-btn.on{ color:var(--amber) }
.star-btn.on svg{ fill:currentColor }
.strength-dot{ width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 0 3px rgba(27,37,64,.04) }

.empty{ text-align:center; padding:70px 20px; color:var(--muted) }
.empty h3{ font-size:16px; color:var(--text); margin:18px 0 6px; font-weight:600 }
.empty p{ font-size:13px; color:var(--muted); margin-bottom:22px }

/* 卡片（设置 / 安全） */
.cards{ display:grid; gap:14px }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:17px 20px; box-shadow:var(--shadow-card) }
.card h3{ display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:4px; color:var(--text) }
.card h3 svg{ color:var(--blue) }
.card.card-danger h3 svg{ color:var(--red) }
.card p.about{ font-size:13px; color:var(--muted); line-height:1.7; margin-top:8px }
.card p.about .path{ font-family:var(--mono); font-size:12px; background:var(--soft); padding:1px 6px; border-radius:5px; color:var(--text) }
.set-row{ display:flex; align-items:center; gap:16px; padding:13px 0; border-top:1px solid var(--line); margin-top:8px }
.set-row:first-of-type{ border-top:0; margin-top:12px }
.set-info{ flex:1; min-width:0 }
.set-info b{ font-size:13.5px; font-weight:500; display:block }
.set-info .sub{ font-size:12px; color:var(--muted); display:block; margin-top:1px }
.cat-row .cat-ic{ width:30px; height:30px; border-radius:8px; background:var(--soft); border:1px solid var(--line); display:grid; place-items:center; color:var(--blue); flex:none }
.cat-row .cat-cnt{ font-size:12px; color:var(--faint); margin-left:auto; flex:none }
.cat-row[draggable="true"]{ cursor:grab }
.cat-row.dragging{ opacity:.4; cursor:grabbing }
.cat-row.drag-over-top{ border-top:2px solid var(--blue) !important; margin-top:-1px }
.cat-row.drag-over-bottom{ box-shadow:inset 0 -2px 0 var(--blue) }
.cat-drag-handle{ color:var(--faint); flex:none; display:inline-flex }
.cat-name-input{ height:32px; font-size:13.5px }
.cat-add-row{ display:flex; gap:8px; align-items:center; padding:14px 0 2px; border-top:1px solid var(--line); margin-top:14px; flex-wrap:wrap }
.cat-add-row input{ flex:1; min-width:140px; height:36px }
.cat-icons{ display:flex; gap:4px; flex-wrap:wrap; padding:10px 0 2px }
.icon-pick{
  width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
  background:var(--card); color:var(--muted); cursor:pointer;
  display:grid; place-items:center; transition:all .13s;
}
.icon-pick:hover{ border-color:var(--line-strong); color:var(--text) }
.icon-pick.sel{ background:var(--blue-soft); border-color:var(--blue-line); color:var(--blue) }

/* 标签编辑器 */
.tag-editor{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:5px 8px; background:var(--card); border:1px solid var(--line-strong); border-radius:10px; min-height:40px; cursor:text; transition:border-color .15s,box-shadow .15s }
.tag-editor:focus-within{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,95,232,.13) }
.tag-chip{ display:inline-flex; align-items:center; gap:2px; padding:2px 4px 2px 10px; background:var(--blue-soft); border:1px solid var(--blue-line); color:var(--blue); border-radius:100px; font-size:12.5px; max-width:180px }
.tag-chip > span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.tag-chip button{ border:0; background:none; color:inherit; cursor:pointer; font-size:15px; line-height:1; padding:2px 5px; opacity:.65 }
.tag-chip button:hover{ opacity:1 }
.tag-editor input{ flex:1; min-width:110px; width:auto; height:28px; border:0; background:none; padding:0; box-shadow:none !important; outline:none !important }
.row-tags{ font-size:11.5px; color:var(--faint); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none }

.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px }
.stat{ background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:16px 18px; box-shadow:var(--shadow-card) }
.stat .num{ font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15 }
.stat .sl{ font-size:12.5px; color:var(--muted); margin-top:3px }
.sec-h{ font-size:13.5px; font-weight:600; margin:20px 0 10px; display:flex; align-items:center; gap:7px }
.sec-h svg{ color:var(--red) }
.sec-h.good svg{ color:var(--green) }
.sec-list .entry{ margin-bottom:6px }
.reuse-group{ background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow-card) }
.reuse-group .rg-t{ font-size:12.5px; color:var(--amber); margin-bottom:8px; display:flex; gap:7px; align-items:center }

/* 生成器 */
.gen-wrap{ max-width:640px; margin:0 auto }
.gen-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:20px; box-shadow:var(--shadow-card) }
.gen-display{
  display:flex; align-items:center; gap:8px; background:var(--soft); border:1px solid var(--line-strong);
  border-radius:12px; padding:15px 16px; margin-bottom:16px;
}
.gen-out{ flex:1; font-family:var(--mono); font-size:17px; color:var(--text); word-break:break-all; line-height:1.45; min-height:25px }
.gen-opts{ display:grid; gap:14px }
.gen-len{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted) }

.gtoggle{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text); cursor:pointer }

.pw-wrap input{ flex:1; min-width:0 }
.pw-wrap .icon-btn{ width:36px; height:36px }

/* ============ 弹窗 ============ */
.modal-backdrop{

  padding:20px; z-index:100; opacity:0; transition:opacity .18s ease-out;
}
.modal-backdrop.show{ opacity:1 }
.modal{
  width:100%; max-width:560px; max-height:calc(100vh - 44px); overflow-y:auto;
  background:var(--card); border:1px solid var(--line); border-radius:16px;

}
.modal-backdrop.show .modal{ transform:none }

.m-url:hover{ color:var(--blue) }
.m-body{ padding:14px 20px 12px; display:grid; gap:11px }
.m-foot{ display:flex; gap:10px; align-items:center; padding:2px 20px 16px }

.strength-tag{ font-size:12px; margin-left:auto }

/* ============ Toast ============ */
#toast-root{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);

}

.toast.warn svg{ color:var(--amber) }
.toast.err svg{ color:var(--red) }

/* ================= 加密核心（浏览器端，零知识） ================= */
async function deriveKey(password, salt, iterations){
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv: b64(iv), data: b64(ct) };
}
async function decryptJSON(key, blob){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.data));
  return JSON.parse(dec.decode(pt));

  if(/[A-Z]/.test(pw)) pool += 26;
  if(/[0-9]/.test(pw)) pool += 10;
  if(/[^a-zA-Z0-9]/.test(pw)) pool += 33;
  let bits = pw.length * Math.log2(pool || 1);
  if(/(.)\1{2,}/.test(pw)) bits *= .85;
  if(/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf|zxcv)/i.test(pw)) bits *= 0.7;
  if(/(password|admin|letmein|iloveyou|111111|123456|abc123)/i.test(pw)) bits = Math.min(bits, 22);
  if(/^[a-zA-Z]+$/.test(pw)) bits *= .9;
  bits = Math.round(bits);
  const score = bits >= 100 ? 4 : bits >= 70 ? 3 : bits >= 45 ? 2 : bits >= 28 ? 1 : 0;
  const labels = ['很弱','弱','一般','强','极强'];
  const colors = ['var(--red)','var(--red)','var(--amber)','var(--green)','var(--green)'];
  return { score, bits, label:labels[score], color:colors[score] };
}
function randInt(max){ // 拒绝采样，保证均匀
  const lim = Math.floor(0x100000000 / max) * max;
  const u = new Uint32Array(1);
  do { crypto.getRandomValues(u); } while(u[0] >= lim);
  return u[0] % max;
}
function genPassword(o){
  const sets = {
    upper:   o.exclude ? 'ABCDEFGHJKLMNPQRSTUVWXYZ' : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower:   o.exclude ? 'abcdefghijkmnpqrstuvwxyz' : 'abcdefghijklmnopqrstuvwxyz',
    digits:  o.exclude ? '23456789' : '0123456789',
    symbols: '!@#$%^&*()-_=+[]{};:,.?/~',
  };
  const active = ['upper','lower','digits','symbols'].filter(k => o[k]);
  if(!active.length || o.length < 4) return '';
  const pool = active.map(k => sets[k]).join('');
  const chars = active.map(k => sets[k][randInt(sets[k].length)]);
  for(let i = chars.length; i < o.length; i++) chars.push(pool[randInt(pool.length)]);
  for(let i = chars.length - 1; i > 0; i--){ const j = randInt(i + 1); [chars[i],chars[j]] = [chars[j],chars[i]]; }
  return chars.join('');
}

function toast(msg, type='ok'){

  el.className = `toast ${type}`;
  el.innerHTML = `${icon(type==='ok'?'checkc':type==='warn'?'warn':'xc',15)}<span>${esc(msg)}</span>`;
  $('#toast-root').appendChild(el);

function openModal(html){
  const root = $('#modal-root');

/* ================= 剪贴板 ================= */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch{}
    ta.remove(); return ok;
  }
}
async function doCopy(text, label, secret=false){
  if(!text){ toast('没有可复制的内容', 'warn'); return; }
  if(await copyText(text)){
    toast(secret ? `${label}已复制 · 30 秒后自动清除` : `${label}已复制`);
    if(secret){
      clearTimeout(S.clipTimer);
      S.clipTimer = setTimeout(async () => { try{ await navigator.clipboard.writeText(''); }catch{} }, 30000);
    }
  } else toast('复制失败，请手动复制', 'err');
}

/* ================= 渲染：安全报告 ================= */
function analyze(){
  const es = S.vault.entries;
  const weak = es.filter(e => passwordStrength(e.password).score <= 1 || e.password.length < 10);
  const byPw = {};
  es.forEach(e => { (byPw[e.password] ||= []).push(e); });
  const reusedGroups = Object.values(byPw).filter(a => a.length > 1);
  const reusedCount = reusedGroups.reduce((s,a) => s + a.length, 0);
  return { weak, reusedGroups, reusedCount };
}
function renderSec(container){
  const a = analyze();
  const total = S.vault.entries.length;
  const ids = new Set();
  a.weak.forEach(e => ids.add(e.id));
  a.reusedGroups.forEach(g => g.forEach(e => ids.add(e.id)));
  const good = total - ids.size;
  let html = `<div class="stats row-in">
    <div class="stat"><div class="num" style="color:${a.weak.length?'var(--red)':'var(--green)'}">${a.weak.length}</div><div class="sl">弱密码</div></div>
    <div class="stat"><div class="num" style="color:${a.reusedCount?'var(--amber)':'var(--green)'}">${a.reusedCount}</div><div class="sl">重复使用</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${good}</div><div class="sl">健康账号</div></div>
  </div>`;
  if(!total){
    html += `<div class="empty row-in"><h3>暂无数据</h3><p>添加账号后，这里会展示弱密码与重复密码的检测结果</p></div>`;
  } else if(ids.size === 0){
    html += `<div class="empty row-in">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;display:block"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <h3>安全状况良好</h3><p>未发现弱密码或重复使用的密码，继续保持</p></div>`;
  } else {
    if(a.weak.length){
      html += `<div class="sec-h">${icon('warn',15)} 弱密码（${a.weak.length}）</div><div class="sec-list">` +
        a.weak.map((e,i) => rowHTML(e,i)).join('') + `</div>`;
    }
    if(a.reusedGroups.length){
      html += `<div class="sec-h">${icon('warn',15)} 重复密码（${a.reusedGroups.length} 组）</div>` +

  }

const tagChip = t => `<span class="tag-chip" data-tag="${esc(t)}"><span>${esc(t)}</span><button type="button" data-action="tag-rm" aria-label="移除标签 ${esc(t)}">×</button></span>`;
function addTagFromInput(){
  const input = document.getElementById('tag-input');
  if(!input) return;
  const v = input.value.replace(/[,，]/g, '').trim();
  input.value = '';
  if(!v) return;
  const editor = document.getElementById('tag-editor');
  const cur = [...editor.querySelectorAll('.tag-chip')].map(c => c.dataset.tag);
  if(cur.includes(v)) return;
  if(cur.length >= 10){ toast('最多添加 10 个标签', 'warn'); return; }
  input.insertAdjacentHTML('beforebegin', tagChip(v));
}

function renderMeter(el, pw){
  if(!el) return;
  const s = passwordStrength(pw);
  el.querySelectorAll('.seg').forEach((seg,i) => seg.style.background = (pw && i < s.score) ? s.color : 'var(--soft2)');
  const lb = el.querySelector('.mlabel');
  if(lb){ lb.textContent = pw ? s.label : '—'; lb.style.color = pw ? s.color : ''; }
}

async function exportBackup(){
  if(!S.blob){ toast('没有可导出的数据', 'warn'); return; }
  const out = { app:'MemKey', version:1, exportedAt:new Date().toISOString(), vault:S.blob };
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type:'application/json' }));
  a.download = `memkey-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已导出加密备份');
}
function handleImportFile(input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  f.text().then(txt => {
    let obj;
    try{ obj = JSON.parse(txt); }catch{ toast('文件格式错误', 'err'); return; }
    const vault = obj?.vault ?? obj;
    if(!vault?.kdf?.salt || !vault?.iv || !vault?.data){ toast('不是有效的 MemKey 备份文件', 'err'); return; }
    S.pendingImport = vault;
    confirmModal({
      title: '导入备份',
      message: `将覆盖当前全部数据（现有 ${S.vault.entries.length} 条记录）。导入后需使用该备份的主密码解锁，此操作不可撤销。`,
      okText: '覆盖并导入', danger: true, action: 'import-confirm',
    });
  }).catch(() => toast('无法读取文件', 'err'));
}
function enterApp(){
  S.vault.settings ??= { autoLock:5 };
  showScreen('scr-app');
  renderApp();
  S.lastActivity = Date.now();
}

/* ================= 事件：点击委托 ================= */
document.addEventListener('click', async e => {
  // 点击下拉外部时关闭所有下拉
  if(!e.target.closest('.dd')) document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action, id = t.dataset.id;
  try{
  switch(a){
    case 'dd-toggle': {
      const dd = t.closest('.dd');
      const wasOpen = dd.classList.contains('open');
      document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
      if(!wasOpen) dd.classList.add('open');
      break;
    }
    case 'dd-opt': {
      const dd = t.closest('.dd');
      const val = t.dataset.val;
      dd.querySelector('input[type=hidden]').value = val;
      dd.querySelector('.dd-cur .dd-lb').innerHTML = t.querySelector('.dd-lb').innerHTML;
      dd.querySelectorAll('.dd-opt').forEach(o => o.classList.toggle('sel', o.dataset.val === val));
      dd.classList.remove('open');
      if(dd.dataset.ddName === 'autolock'){
        S.vault.settings.autoLock = +val;
        await persist();
        toast(+val === 0 ? '已关闭自动锁定' : `将在 ${val} 分钟无操作后自动锁定`);
      }
      break;
    }
    case 'cat-icon-pick': {
      S.newCatIcon = t.dataset.ic;
      document.querySelectorAll('.cat-icons .icon-pick').forEach(b => b.classList.toggle('sel', b.dataset.ic === S.newCatIcon));
      break;
    }
    case 'cat-add': {
      const input = $('#new-cat-name');
      const label = input.value.trim();
      if(!label){ toast('请输入分类名称', 'warn'); input.focus(); break; }
      if(getCats().some(c => c.label === label)){ toast('已存在同名分类', 'warn'); break; }
      S.vault.categories.push({ id:'c_' + uuid().slice(0,8), label, icon:S.newCatIcon || 'tag' });
      await persist();
      renderSet($('#view .view-inner'));
      toast('分类已添加');
      break;
    }
    case 'cat-rename': {
      S.catEditing = t.dataset.id;
      renderSet($('#view .view-inner'));
      setTimeout(() => { const inp = $('#cat-rename-input'); if(inp){ inp.focus(); inp.select(); } }, 40);
      break;
    }
    case 'cat-rename-save': {
      const input = $('#cat-rename-input');
      const label = input.value.trim();
      if(!label){ toast('名称不能为空', 'warn'); break; }
      const c = S.vault.categories.find(x => x.id === S.catEditing);
      if(c) c.label = label;
      S.catEditing = null;
      await persist();
      renderApp();
      toast('分类已重命名');
      break;
    }
    case 'cat-rename-cancel': {
      S.catEditing = null;
      renderSet($('#view .view-inner'));
      break;
    }
    case 'cat-del': {
      const c = S.vault.categories.find(x => x.id === t.dataset.id);
      if(!c || t.dataset.id === 'other') break;
      confirmModal({
        title:'删除分类',
        message:`「${c.label}」将被删除，其下的账号会归入「其他」。确定删除吗？`,
        okText:'删除', danger:true, action:'cat-del-confirm', dataId:t.dataset.id,
      });
      break;
    }
    case 'cat-del-confirm': {
      S.vault.categories = S.vault.categories.filter(x => x.id !== id);
      S.vault.entries.forEach(en => { if((en.category || 'other') === id) en.category = 'other'; });
      if(S.cat === id){ S.cat = 'all'; }
      await persist();
      closeModal();
      renderApp();
      toast('分类已删除');
      break;
    }
    case 'forgot': {
      openModal(`
      <form class="modal" data-form="reset" role="dialog" aria-modal="true" aria-label="重置保险库" autocomplete="off" style="max-width:440px">
        <div class="m-head"><div class="m-title">重置保险库</div><div class="grow"></div>
          <button type="button" class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('x',18)}</button></div>
        <div class="m-body">
          <div class="warnbox" style="margin-top:4px">${icon('warn',15)}<span>零知识架构下没有任何找回途径。重置将<b>永久删除</b>本机密码库（data/vault.enc）中的全部数据，无法撤销。若之前导出过加密备份，仍可凭主密码导入恢复。</span></div>
          <div class="frow"><label class="flabel">输入「重置」以确认</label><input type="text" id="reset-input" placeholder="重置" maxlength="10"></div>
        </div>
        <div class="m-foot">
          <div class="grow"></div>
          <button type="button" class="btn" data-action="close-modal">取消</button>
          <button type="submit" class="btn btn-danger">${icon('trash',14)} 删除并重置</button>
        </div>
      </form>`);
      break;
    }
    case 'nav-cat':
      S.view = 'list'; S.cat = t.dataset.cat; S.tag = null;
      $('#scr-app').classList.remove('sb-open');
      renderApp(); break;
    case 'nav-tag':
      S.view = 'list'; S.tag = t.dataset.tag; S.cat = 'all';
      $('#scr-app').classList.remove('sb-open');
      renderApp(); break;
    case 'edit-fav': {
      const on = t.classList.toggle('on');
      t.title = on ? '取消收藏' : '收藏';
      S.editDirty = true;
      break;
    }
    case 'tag-rm': {
      t.closest('.tag-chip')?.remove();
      break;
    }
    case 'tag-focus': {
      const inp = document.getElementById('tag-input');
      if(inp && !e.target.closest('.tag-chip')) inp.focus();
      break;
    }
    case 'nav-view':
      S.view = t.dataset.view; S.tag = null;
      $('#scr-app').classList.remove('sb-open');
      renderApp(); break;
    case 'menu':
      $('#scr-app').classList.toggle('sb-open'); break;
    case 'sb-close':
      $('#scr-app').classList.remove('sb-open'); break;
    case 'lock':
      lockNow(); break;
    case 'add':
      openEdit(null); break;
    case 'open-detail':
      openDetail(id); break;
    case 'edit':
      openEdit(S.detail); break;
    case 'close-modal':
      closeModal(); break;
    case 'fav': {
      const en = findEntry(id); if(!en) break;
      en.favorite = !en.favorite;
      await persist();
      renderApp();
      if(S.detail === id && !$('#modal-root').hidden) openDetail(id);
      break;
    }
    case 'copy-user': { const en = findEntry(id); if(en) doCopy(en.username, '用户名'); break; }
    case 'copy-pass': { const en = findEntry(id); if(en) doCopy(en.password, '密码', true); break; }
    case 'copy-notes': { const en = findEntry(id); if(en) doCopy(en.notes, '备注'); break; }
    case 'reveal': {
      const span = document.getElementById(t.dataset.target);
      const en = findEntry(S.detail);
      if(!span || !en) break;
      const showing = span.classList.toggle('revealed');
      span.textContent = showing ? en.password : '•'.repeat(Math.min(String(en.password||'').length || 8, 16));
      t.innerHTML = icon(showing ? 'eyeoff' : 'eye', 16);
      break;
    }
    case 'eye': {
      const input = document.getElementById(t.dataset.target);
      if(!input) break;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      t.innerHTML = icon(show ? 'eyeoff' : 'eye', 17);
      break;
    }
    case 'delete':
      confirmModal({ title:'删除账号', message:'确定要删除该账号记录吗？此操作不可撤销。', okText:'删除', danger:true, action:'del-confirm', dataId:S.detail });
      break;
    case 'del-confirm': {
      S.vault.entries = S.vault.entries.filter(x => x.id !== id);
      await persist();
      closeModal();
      renderApp();
      toast('已删除');
      break;
    }
    case 'gen-toggle': {
      const box = t.closest('.frow')?.querySelector('.gen-embed');
      if(!box) break;
      box.hidden = !box.hidden;
      if(!box.hidden){ box._gen.value = genPassword(box._gen); renderGenBox(box); }
      break;
    }
    case 'gen-regen': {
      const box = t.closest('.gen');
      if(box){ box._gen.value = genPassword(box._gen); renderGenBox(box); }
      break;
    }
    case 'gen-copy': {
      const box = t.closest('.gen');
      if(box) doCopy(box._gen.value, '密码', true);
      break;
    }
    case 'gen-use': {
      const box = t.closest('.gen');
      const form = t.closest('form');
      if(!box || !form) break;
      const input = form.querySelector('[name=password]');
      input.value = box._gen.value;
      renderMeter(form.querySelector('.meter'), input.value);
      box.hidden = true;
      input.focus();
      break;
    }
    case 'export': exportBackup(); break;
    case 'import-click': $('#file-import').click(); break;
    case 'import-confirm': {
      if(!S.pendingImport) break;
      await apiPutVault(S.pendingImport);
      S.pendingImport = null;
      lockNow('备份已导入，请输入该备份的主密码解锁');
      break;
    }
    case 'chgpass': openChangeMaster(); break;
    case 'wipe':
      confirmModal({ title:'清除所有数据', message:'将删除本机密码库文件（data/vault.enc）与全部数据，且不可恢复。如果没有导出过备份，所有账号记录将永久丢失。', okText:'确认清除', danger:true, action:'wipe-confirm' });
      break;
    case 'wipe-confirm':
      await apiDeleteVault();
      location.reload();
      break;
  }
  }catch(ex){ console.error(ex); toast('操作失败：' + (ex.message || ex), 'err'); }
});

/* ================= 事件：表单提交 ================= */
document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  try{
  if(form.dataset.form === 'setup'){
    const pw = $('#su-pw').value, pw2 = $('#su-pw2').value;
    if(pw.length < 8){ const el = $('#su-pw'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),420); toast('主密码至少需要 8 位', 'warn'); return; }
    if(pw !== pw2){ const el = $('#su-pw2'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),420); toast('两次输入的密码不一致', 'warn'); return; }
    if(!$('#su-ack').checked){ toast('请先勾选确认项', 'warn'); return; }
    const btn = $('#su-btn');
    busy(btn, true, '正在创建…');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    S.key = await deriveKey(pw, salt, KDF_ITERS);
    S.vault = { entries:[], settings:{ autoLock:5 }, meta:{ createdAt:Date.now() }, categories: CATS.map(c => ({ ...c })) };
    S.blob = { kdf:{ name:'PBKDF2-SHA256', iterations:KDF_ITERS, salt:b64(salt) } };
    await persist();
    busy(btn, false);
    enterApp();
    toast('保险库已创建，数据保存在本机文件');
  }
  else if(form.dataset.form === 'lock'){
    const pw = $('#lk-pw').value;
    if(!pw) return;
    const btn = $('#lk-btn'), err = $('#lk-err');
    busy(btn, true, '解锁中…');
    err.hidden = true;
    try{
      const key = await deriveKey(pw, unb64(S.blob.kdf.salt), S.blob.kdf.iterations);
      S.vault = await decryptJSON(key, S.blob);
      S.vault.categories ??= CATS.map(c => ({ ...c })); // 老数据迁移：初始化默认分类
      S.key = key;
      busy(btn, false);
      $('#lk-pw').value = '';
      $('#lk-note').hidden = true;
      enterApp();
    }catch{
      busy(btn, false);
      err.textContent = '主密码不正确，请重试';
      err.hidden = false;
      const el = $('#lk-pw');
      el.value = ''; el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),420);
      el.focus();
    }
  }
  else if(form.dataset.form === 'edit'){
    const fd = new FormData(form);
    const title = String(fd.get('title') || '').trim();
    if(!title){ toast('请填写名称', 'warn'); form.querySelector('[name=title]').focus(); return; }
    const now = Date.now();
    const old = S.editing ? findEntry(S.editing) : null;
    const entry = {
      id: old ? old.id : uuid(),
      title,
      username: String(fd.get('username') || '').trim(),
      password: String(fd.get('password') || ''),
      url: String(fd.get('url') || '').trim(),
      notes: String(fd.get('notes') || '').trim(),
      category: fd.get('category') || 'other',
      favorite: form.querySelector('[data-action=edit-fav]')?.classList.contains('on') || false,
      tags: [...form.querySelectorAll('#tag-editor .tag-chip')].map(el => el.dataset.tag),
      createdAt: old ? old.createdAt : now,
      updatedAt: now,
    };
    if(old){ Object.assign(old, entry); }
    else S.vault.entries.push(entry);
    const saveBtn = form.querySelector('[type=submit]');
    busy(saveBtn, true, '保存中…');
    await persist();
    busy(saveBtn, false);
    S.editDirty = false;
    closeModal();
    renderApp();
    if(entry.password && passwordStrength(entry.password).score <= 1) toast('已保存 · 提示：密码强度较弱，建议更换');
    else toast('已保存');
  }
  else if(form.dataset.form === 'reset'){
    const input = document.getElementById('reset-input');
    if((input?.value || '').trim() !== '重置'){ toast('请输入「重置」以确认', 'warn'); input?.focus(); return; }
    const btn = form.querySelector('[type=submit]');
    busy(btn, true, '重置中…');
    await apiDeleteVault();
    location.reload();
  }
  else if(form.dataset.form === 'chgpass'){
    const old_ = $('#cp-old').value, nw = $('#cp-new').value, nw2 = $('#cp-new2').value;
    const err = $('#cp-err');
    const fail = m => { err.textContent = m; err.hidden = false; };
    err.hidden = true;
    if(nw.length < 8) return fail('新主密码至少需要 8 位');
    if(nw !== nw2) return fail('两次输入的新密码不一致');
    const btn = form.querySelector('[type=submit]');
    busy(btn, true, '验证中…');
    try{
      const k = await deriveKey(old_, unb64(S.blob.kdf.salt), S.blob.kdf.iterations);
      await decryptJSON(k, S.blob); // 验证旧密码
    }catch{ busy(btn, false); return fail('当前主密码不正确'); }
    busy(btn, true, '重新加密…');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    S.blob.kdf.salt = b64(salt);
    S.blob.kdf.iterations = KDF_ITERS;
    S.key = await deriveKey(nw, salt, KDF_ITERS);
    await persist();
    busy(btn, false);
    closeModal();
    toast('主密码已更新，后续请使用新密码解锁');
  }
  }catch(ex){ console.error(ex); toast('操作失败：' + (ex.message || ex), 'err'); }
});

/* ================= 事件：输入 / 变更 ================= */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('[data-strength]')){
    renderMeter(document.getElementById(t.dataset.strength), t.value);
    if(t.id === 'su-pw') renderChecklist(t.value);
  }
  if(t.id === 'search'){
    S.q = t.value;
    if(S.view !== 'list'){ S.view = 'list'; S.cat = 'all'; S.tag = null; renderSidebar(); $('#page-title').textContent = pageTitle(); }
    renderList($('#view .view-inner'));
  }
  if(t.matches('[data-gen-ctrl]') && t.type === 'range') updateGen(t);
  if(t.closest('[data-form=edit]')) S.editDirty = true;
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('[data-gen-ctrl]') && t.type !== 'range') updateGen(t);
  if(t.id === 'tag-input' && t.value.trim()) addTagFromInput();
  if(t.id === 'file-import') handleImportFile(t);
});
function updateGen(t){
  const box = t.closest('.gen');
  if(!box || !box._gen) return;
  const st = box._gen, k = t.dataset.genCtrl;
  if(k === 'length') st.length = +t.value;
  else{
    st[k] = t.checked;
    if(['upper','lower','digits','symbols'].includes(k) && !st.upper && !st.lower && !st.digits && !st.symbols){
      st[k] = true; t.checked = true;
      toast('至少保留一种字符类型', 'warn');
    }
  }
  st.value = genPassword(st);
  renderGenBox(box);
}

/* ================= 事件：分类拖拽排序 ================= */
let dragRow = null;
const clearDropMarks = () => document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el => el.classList.remove('drag-over-top','drag-over-bottom'));
document.addEventListener('dragstart', e => {
  const row = e.target.closest?.('.cat-row');
  if(!row || !row.draggable) return;
  dragRow = row;
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', ''); }catch{}
});
document.addEventListener('dragend', () => {
  if(!dragRow) return;
  dragRow.classList.remove('dragging');
  clearDropMarks();
  dragRow = null;
});
document.addEventListener('dragover', e => {
  if(!dragRow) return;
  e.preventDefault();
  const row = e.target.closest?.('.cat-row');
  clearDropMarks();
  if(!row || row === dragRow) return;
  const rect = row.getBoundingClientRect();
  row.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
});
document.addEventListener('drop', async e => {
  if(!dragRow) return;
  e.preventDefault();
  const target = e.target.closest?.('.cat-row');
  clearDropMarks();
  dragRow.classList.remove('dragging');
  if(!target || target === dragRow){ dragRow = null; return; }
  // DOM 原位重排，避免整页重渲染
  const before = e.clientY < target.getBoundingClientRect().top + target.getBoundingClientRect().height / 2;
  target.parentNode.insertBefore(dragRow, before ? target : target.nextSibling);
  dragRow = null;
  // 按新 DOM 顺序同步数据并静默保存
  const ids = [...document.querySelectorAll('.cat-row')].map(r => r.dataset.cid);
  S.vault.categories.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  try{
    await persist();
    renderSidebar(); // 仅侧栏同步顺序
    toast('分类顺序已更新');
  }catch(ex){
    toast('保存失败：' + (ex.message || ex), 'err');
  }
});

/* ================= 事件：键盘 ================= */
document.addEventListener('keydown', e => {
  if(e.target.id === 'tag-input' && (e.key === 'Enter' || e.key === ',' || e.key === '，')){
    e.preventDefault();
    addTagFromInput();
    return;
  }
  if(e.key === 'Escape'){
    const openDD = document.querySelector('.dd.open');
    if(openDD){ openDD.classList.remove('open'); return; }
    if(!$('#modal-root').hidden){
      if(S.editDirty){
        if(Date.now() - S.lastEsc < 1800) closeModal();
        else { S.lastEsc = Date.now(); toast('有未保存的修改，再按一次 Esc 放弃', 'warn'); }
      } else closeModal();
    } else $('#scr-app').classList.remove('sb-open');
    return;
  }
  if((e.key === 'Enter' || (e.key === ' ' && !e.repeat)) && e.target.closest?.('[role=button][data-action],[role=option][data-action]') === e.target && e.target.tagName !== 'FORM'){
    e.preventDefault(); e.target.click(); return;
  }
  if(e.key === '/' && !$('#scr-app').hidden){
    const ae = document.activeElement;
    if(!ae.matches('input,textarea,select') && $('#modal-root').hidden){
      e.preventDefault();
      $('#search').focus();
    }
  }
});
/* 弹窗内 Tab 焦点圈定 */
$('#modal-root').addEventListener('keydown', e => {
  if(e.key !== 'Tab') return;
  const f = [...$('#modal-root').querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled && el.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ================= 自动锁定 ================= */
let lastMoveT = 0;
function touchActivity(){ S.lastActivity = Date.now(); }
document.addEventListener('mousemove', () => { const n = Date.now(); if(n - lastMoveT > 1000){ lastMoveT = n; touchActivity(); } }, { passive:true });
['pointerdown','keydown','wheel','touchstart'].forEach(ev => document.addEventListener(ev, touchActivity, { passive:true }));
setInterval(() => {
  const m = S.vault?.settings?.autoLock ?? 5;
  if(S.key && m > 0 && Date.now() - S.lastActivity > m * 60000)
    lockNow('长时间无操作，已自动锁定');
}, 5000);

/* ================= 启动：从本地服务读取密文文件 ================= */
(async function boot(){
  renderChecklist('');
  try{
    const r = await fetch('/api/meta');
    if(r.ok) S.meta = await r.json();
  }catch{}
  let blob = null;
  try{ blob = await apiGetVault(); }catch{}
  if(!blob){
    showScreen('scr-setup');
    setTimeout(() => $('#su-pw').focus(), 80);
    return;
  }
  S.blob = blob;
  showScreen('scr-lock');
  setTimeout(() => $('#lk-pw').focus(), 80);
})().catch(err => {
  console.error(err);
  document.body.innerHTML = `<div style="display:grid;place-items:center;height:100vh;color:#DC2626;font-family:sans-serif;text-align:center;padding:20px">
    <div><h2>无法连接本地服务</h2><p style="color:#5D6B85;margin-top:8px">请先运行 启动MemKey.bat 启动 MemKey 服务，再刷新此页面。</p></div></div>`;
});
